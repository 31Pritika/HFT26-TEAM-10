<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShadowScope Shadow Sensor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="">
    <h1>Shadow Sensor</h1>
    <label class="row"><span id="state" class="muted">On</span><input id="enabled" type="checkbox" aria-label="Scan pastes and prompts" checked></label>
  </header>
  <section class="panel row">
    <span>Engine</span>
    <span id="engine" class="engine" data-online="false">Checking…</span>
  </section>
  <section class="panel">
    <table>
      <caption class="muted" hidden>Today's activity by site</caption>
      <thead><tr><th scope="col">Today</th><th scope="col">Events</th><th scope="col">Findings</th><th scope="col">Redacted</th></tr></thead>
      <tbody id="sites"></tbody>
    </table>
    <p id="empty" class="muted">Nothing yet today.</p>
  </section>
  <button id="dashboard">Open dashboard</button>
  <script src="popup.js"></script>
</body>
</html>
