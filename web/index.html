<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Painted before the stylesheet arrives. The real tokens are in src/index.css. -->
    <style>
      html { background: #0D0B0D; color-scheme: dark; }
      html[data-theme="light"] { background: #F6F1EA; color-scheme: light; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0B0D" />
    <script>
      // Runs before first paint, so a saved light theme never flashes dark.
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("shadowscope_theme") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (theme === "light") document.querySelector('meta[name="theme-color"]').content = "#F6F1EA";
      })();
    </script>
    <meta
      name="description"
      content="ShadowScope — AI Shadow IT &amp; Agentic Data Exfiltration Scanner. Detect unmonitored LLMs, inspect local loopback ports, trace autonomous agent execution, and trap data leaks in real time."
    />
    <meta property="og:title" content="ShadowScope · AI Shadow IT Scanner" />
    <meta
      property="og:description"
      content="AI Shadow IT &amp; Agentic Data Exfiltration Scanner. Detect unmonitored LLMs, inspect local loopback ports, trace autonomous agent execution, and trap data leaks in real time."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/experience/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/experience/og-image.png" />
    <meta name="twitter:title" content="ShadowScope · AI Shadow IT Scanner" />
    <meta
      name="twitter:description"
      content="AI Shadow IT &amp; Agentic Data Exfiltration Scanner. Detect unmonitored LLMs, inspect local loopback ports, trace autonomous agent execution, and trap data leaks in real time."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>ShadowScope · AI Shadow IT Scanner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
