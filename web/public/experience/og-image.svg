<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Dark Obsidian Cyber Background -->
  <rect width="1200" height="630" fill="#05060A"/>
  
  <!-- Subtle Ambient Gradients -->
  <radialGradient id="ogGlow1" cx="20%" cy="30%" r="60%">
    <stop offset="0%" stopColor="#22D3EE" stopOpacity="0.14"/>
    <stop offset="60%" stopColor="#8B5CF6" stopOpacity="0.05"/>
    <stop offset="100%" stopColor="#05060A" stopOpacity="0"/>
  </radialGradient>
  <radialGradient id="ogGlow2" cx="80%" cy="70%" r="50%">
    <stop offset="0%" stopColor="#FF3B5C" stopOpacity="0.08"/>
    <stop offset="60%" stopColor="#8B5CF6" stopOpacity="0.03"/>
    <stop offset="100%" stopColor="#05060A" stopOpacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#ogGlow1)"/>
  <rect width="1200" height="630" fill="url(#ogGlow2)"/>

  <!-- Cyber Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Big Decorative Scope Ring on Right -->
  <g transform="translate(920, 315)">
    <circle r="220" stroke="rgba(34,211,238,0.15)" stroke-width="2" stroke-dasharray="10 8"/>
    <circle r="160" stroke="#22D3EE" stroke-width="2.5" stroke-opacity="0.6"/>
    <circle r="100" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.4"/>
    <circle r="20" fill="rgba(34,211,238,0.1)" stroke="#22D3EE" stroke-width="1.5"/>
    
    <!-- Crosshairs -->
    <line x1="0" y1="-240" x2="0" y2="-170" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="170" x2="0" y2="240" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-240" y1="0" x2="-170" y2="0" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="170" y1="0" x2="240" y2="0" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Intercepted Exfiltration Blip -->
    <circle cx="85" cy="-80" r="10" fill="#FF3B5C"/>
    <circle cx="85" cy="-80" r="18" stroke="#FF3B5C" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="-65" cy="95" r="7" fill="#22D3EE"/>
    <circle cx="110" cy="50" r="6" fill="#FACC15"/>
  </g>

  <!-- Content Group (Left Side) -->
  <g transform="translate(100, 110)">
    <!-- Top Pill -->
    <rect width="360" height="34" rx="17" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.3)" stroke-width="1"/>
    <circle cx="20" cy="17" r="4.5" fill="#22D3EE"/>
    <text x="34" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#22D3EE" letter-spacing="1">
      ZERO SSL DECRYPTION · AI EGRESS SCANNER
    </text>

    <!-- Main Title -->
    <text x="0" y="115" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="900" fill="#E6EDF3" letter-spacing="-1">
      ShadowScope
    </text>

    <!-- Pitch Subtitle -->
    <text x="0" y="165" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="700" fill="#8B949E">
      AI Shadow IT &amp; Agentic Data Exfiltration Scanner
    </text>

    <!-- Narrative Paragraph -->
    <text x="0" y="215" font-family="system-ui, sans-serif" font-size="16" fill="#8B949E">
      Continuous passive discovery of shadow AI tools, autonomous agent loops, and
    </text>
    <text x="0" y="240" font-family="system-ui, sans-serif" font-size="16" fill="#8B949E">
      unencrypted credentials across host sockets, plaintext TLS SNI, and loopback sniffers.
    </text>

    <!-- Key Feature Badges Strip -->
    <g transform="translate(0, 290)">
      <!-- Badge 1 -->
      <g>
        <rect width="180" height="42" rx="8" fill="#121622" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#22D3EE">
          ⚡ 32+ Detection Rules
        </text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(195, 0)">
        <rect width="210" height="42" rx="8" fill="#121622" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#8B5CF6">
          🛡️ DPDP &amp; GDPR Reports
        </text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(420, 0)">
        <rect width="200" height="42" rx="8" fill="#121622" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34D399">
          🌐 3D Constellation
        </text>
      </g>
    </g>

    <!-- Team Attribution Footer -->
    <text x="0" y="410" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6E7681">
      Team "git push n pray" · Hacktoberfest @ CBIT 2026 · github.com/31Pritika/HFT26-TEAM-10
    </text>
  </g>
</svg>
