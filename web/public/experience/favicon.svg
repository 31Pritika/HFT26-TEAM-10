<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#05060A"/>
  
  <!-- Outer glowing radar ring -->
  <circle cx="32" cy="32" r="24" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 3"/>
  <circle cx="32" cy="32" r="18" stroke="#22D3EE" stroke-width="2.5" stroke-opacity="0.85"/>
  
  <!-- Crosshairs -->
  <line x1="32" y1="4" x2="32" y2="12" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="60" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="12" y2="32" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="60" y2="32" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center focal radar point -->
  <circle cx="32" cy="32" r="5" fill="#8B5CF6"/>
  <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
  
  <!-- Intercepted threat blip -->
  <circle cx="43" cy="21" r="3.5" fill="#FF3B5C"/>
  <circle cx="43" cy="21" r="5.5" stroke="#FF3B5C" stroke-width="1" stroke-opacity="0.6"/>
</svg>
